name: simulation
channels:
  - conda-forge
  - defaults
dependencies:
  - ipython
  - ipywidgets
  - jupyterlab
  - jupyterlab_server
  - nb_conda_kernels
  - nbconvert
  - nbformat
  - pip
  - python=3.11
  - numpy>=2  # cvxpy >=1.8 is built against the numpy 2 ABI
  - sympy
  - cvxpy
  - matplotlib
  - scipy
  - osqp
  - pyyaml
  - pip:
    - mujoco
    - black>=24
